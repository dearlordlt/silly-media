services:
  silly-media:
    build: .
    ports:
      - "4201:4201"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - hy3dgen-cache:/root/.cache/hy3dgen
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # TRANSFORMERS_CACHE must point at the dir containing the models--* trees, which is
      # $HF_HOME/hub — not HF_HOME itself. Pointing it one level up made some loaders write
      # a second copy at the top level, splitting models across two layouts (~17GB wasted).
      # Overrides the Dockerfile ENV so this applies without a full rebuild.
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/hub
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    healthcheck:
      # curl isn't installed in the image, so the old curl-based probe always failed and
      # the container sat permanently "unhealthy" despite serving fine. Use python3.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4201/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Development mode with hot reload
  silly-media-dev:
    build: .
    ports:
      - "4201:4201"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - hy3dgen-cache:/root/.cache/hy3dgen
      - ./src:/app/src:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # TRANSFORMERS_CACHE must point at the dir containing the models--* trees, which is
      # $HF_HOME/hub — not HF_HOME itself. Pointing it one level up made some loaders write
      # a second copy at the top level, splitting models across two layouts (~17GB wasted).
      # Overrides the Dockerfile ENV so this applies without a full rebuild.
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/hub
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    command: ["python", "-m", "uvicorn", "silly_media.main:app", "--host", "0.0.0.0", "--port", "4201", "--reload", "--reload-dir", "/app/src"]
    profiles:
      - dev

volumes:
  huggingface-cache:
  hy3dgen-cache:
